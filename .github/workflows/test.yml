name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} / ${{ matrix.timezone }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        # Node 18 is an EOL compatibility check, not a recommended runtime.
        node: ['18', '22', '24', '26']
        timezone: ['UTC', 'America/Sao_Paulo']
    env:
      TZ: ${{ matrix.timezone }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      # There are no npm dependencies to install. pretest generates the fixture.
      - run: npm test
